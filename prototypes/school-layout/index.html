<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- layout: meters, x = sketch right (east), z = sketch down (south), y up; origin at the school wall's north-west corner ----------
// Scale from Xining's Wusi Primary School, the reference: about 14,800 m² of grounds, so one sketch pixel is about 0.185 m.
// Positions are the sketch's at that scale, rounded; sizes of standard things (courts, tables, lanes) are their real ones.
const WALL_H = 2.4, WT = 0.24;                // brick walls
const SCHOOL = { x: [0, 149], z: [0, 92] };    // the school wall, by centerline; the east side drawn 11 m narrower
const GATE = [72, 80], BACK = [6, 10];         // main gate in the north wall (x), back gate in the west wall (z)
const FH = 3.6;                                // classroom storey
// doors: [name, side, from, to] along that side; the first door opens under a stair tower, as at the Wusi school
// teaching building 1, walkable inside, by wall centerlines. One grade a floor in six classrooms on the plaza side; a corridor
// along the east wall past everything. From the north: the water room, a narrow stair, three classrooms, the wide stair inside the
// stair tower beside a passage from door 1, three classrooms, a narrow stair, the teachers' toilet.
const TB1_X = [114.5, 123.5, 126.5];  // west wall, corridor wall (rooms 9 m deep), east wall (corridor 3 m wide)
const TB1_BAYS = [['water', 3.6], ['stair', 3.24], ['room', 8.4], ['room', 8.4], ['room', 8.4], ['wide', 7],
  ['room', 8.4], ['room', 8.4], ['room', 8.4], ['stair', 3.24], ['toilet', 3.6]].reduce((out, [kind, d]) => {
  const z = out.length ? out[out.length - 1].z[1] : 13.6;
  return [...out, { kind, z: [z, z + d] }];
}, []);
const TB1 = { name: '教学楼1', note: '一层一个年级，每层 6 个班 · 4 层', x: [TB1_X[0], TB1_X[2]], z: [TB1_BAYS[0].z[0], TB1_BAYS.at(-1).z[1]], floors: 4 };
const TB1_CORR = TB1_X[1];
const TB1_ROOMS = TB1_BAYS.slice(1).map(b => b.z[0]);  // cross walls (z)
// stair bays: z range; the half landing from hx0 to hx1 at the west; flights up westward (north half) then eastward (south half)
// between hx1 and lx, over fz; the floor landing from lx to the corridor. The wide one reaches into the tower and leaves a passage.
const TB1_STAIRS = TB1_BAYS.filter(b => b.kind === 'stair' || b.kind === 'wide').map(({ kind, z }) => kind === 'wide'
  ? { z, fz: [z[0], z[0] + 4.4], hx0: TB1_X[0] - 1.38, hx1: TB1_X[0] + 1.3, lx: TB1_X[0] + 4.38 }
  : { z, fz: z, hx0: TB1_X[0] + 0.12, hx1: TB1_X[0] + 1.5, lx: TB1_X[0] + 4.58 });
const TB1_DOOR1 = [TB1_STAIRS[1].fz[1] + 0.36, TB1_STAIRS[1].z[1] - 0.44];  // in the tower's west wall, onto the passage
// teaching building 2, walkable inside, by wall centerlines: a ring of rooms around a ring corridor around an atrium open through
// all six floors under a pointed glass roof, with a spiral stair at each end of the atrium. As wide as the site sketch draws it.
const TB2 = { name: '教学楼2', note: '回字形 · 五六年级、办公室、实验室、活动室、机房 · 6 层', x: [37.5, 64.5], z: [18, 76], floors: 6 };
const TB2_RING = { x: [44.1, 57.9], z: [25.2, 68.8] };      // the corridor's outer walls: rooms 6.6 m deep east and west, 7.2 north and south
const TB2_ATRIUM = { x: [46.5, 55.5], z: [27.6, 66.4] };    // inside the 2.4 m corridor
// spiral stairs, 1.8 m radius, one turn a storey: center, and the angle (0 north, clockwise) where each floor's corridor meets them
const TB2_SPIRALS = [{ c: [51, 29.3], e: 0 }, { c: [51, 64.7], e: Math.PI }];
const TB2_DOOR1 = [28, 30.4], TB2_DOOR2 = [36, 38.4];      // in the east wall to the plaza and the west wall to the courts
const PLAZA = { x: [66, 108], z: [18, 76] };
const STAND = { x: [79, 95], z: [79.5, 84.5], h: 1.2 }, STEPS = { x: [83, 91], z: [77, 79.5] };  // the rostrum faces north, up its steps
const POLE = [87, 72];                                    // not in the sketch
const LODGE = { x: [83, 90], z: [0.12, 6] };              // the gatekeeper's lodge beside the gate, smaller than drawn
const TOILET = { x: [134, 148.88], z: [19.5, 35] };       // the toilet block on the east wall
const TOILET_H = 3.6, TOILET_MEN_Z = 28.5;                 // storey height; the boys' ground floor stops at this z
const TOILET_DOORS = { men: [136.5, 138.3], women: [144.9, 146.3] };  // open doorways facing south: the boys' off the open bay, the girls' upstairs
const TOILET_STAIR = { z: [35.12, 36.8], landing: [144.4, 146.8], foot: 138.5 };  // up the outside of the south wall, rising east
const STORE = { x: [3, 19], z: [67, 75] };                // sports equipment store south of the courts: not in the sketch
const COURTS = { x: [1, 36.5], z: [19, 63] };             // two courts, 28 × 15 m, along x, clear of teaching building 2

const ALLEY = [149.12, 151.9], ALLEY_END = 90;            // "very cramped, no car gets through": narrower than drawn
const SHOPS_N = { x: [151.9, 239.2], z: [0, 12] }, SHOPS_E = { x: [227.2, 239.2], z: [12, 92.12] };  // reaches the mall
const FLATS = [[22, 33], [45, 56], [68, 79]];             // housing blocks in the yard: not in the sketch
const YARD_DOORS = [[16, 19], [58, 61]];                  // from the alley into the yard: not in the sketch

const ROAD = [-10.5, -3.5];         // the asphalt road (z), two lanes, sidewalks on both sides
const DIRT = [-12.3, -5.3];         // the dirt road (x), two cars wide, through a belt of trees on each side
const MAIN = [244.2, 260.2];        // the main road (x), four lanes like Shengli Road, sidewalks 5 m wide
const STOP = [241.6, 15];           // bus stop on the main road's west sidewalk
const RICH = { x: [-0.6, 237], z: [-106, -19.8] }, RICH_GATE = [100, 110];
const SITE = { x: [-79.4, -17], z: [-106, -32.4] };       // the abandoned building site
const FIELD = { x: [-80.3, -17.6], z: [-27.8, 92] }, FIELD_GATE = [6, 10];  // the field's gate is not in the sketch
const TC = [-49, 32.8];             // track center
const IRON = 92;                    // the double iron gate at the dirt road's south end (z): the mall's side door

// the mall south of the school, against its south wall: a passage with shops on both sides, a market upstairs
const MALL = { x: [-121.6, 239.2], z: [92.12, 122.12] };  // 40 m longer to the west than drawn, 30 m deep instead of 52
const TUNNEL = [103.12, 111.12];   // the ground floor's passage (z), open at both ends
const MF = 5.3, MH = 4.2;          // upper floor level, upper storey height
const STAIR_X = [-80, 60, 200], STAIR_TOP = 94.75;  // straight stairs north from the passage, each 3 m wide, in place of a shop
const FX = 100, FZ = -5;            // site center

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4d8dd);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b0b0, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.far = 1500;
sun.shadow.normalBias = 0.05;  // keeps the low sun from striping the flat yard
scene.add(sun, sun.target);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const M = {
  wall: mat(0xf0efea), wall2: mat(0xe2dccf), guess: mat(0xf2c48a), slab: mat(0xd9d7d1), concrete: mat(0xb9b6ae), roof: mat(0xa8503c),
  ground: mat(0xa7ad9f), yard: mat(0xc4bfb4), road: mat(0x9c9b96), walk: mat(0xb8b4ab), asphalt: mat(0x55585c), dirt: mat(0x9a8a70),
  green: mat(0x8a9a74), grass: mat(0x86a06a), track: mat(0xa8705c), court: mat(0x9ea3a3), line: mat(0xeeeeea), yellow: mat(0xd8b23a),
  floor: mat(0xbdb7ab), tile: mat(0xc8cdd0), white: mat(0xf4f4f0), board: mat(0x2f4a3a), desk: mat(0xb08a5a), chair: mat(0x8a6a44),
  pane: new THREE.MeshLambertMaterial({ color: 0x9cc4e8, transparent: true, opacity: 0.35, depthWrite: false }),
  glassRoof: new THREE.MeshLambertMaterial({ color: 0xbfdcec, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  door: mat(0xd02a2a), window: mat(0x6fa8e0), glass: mat(0x5f6870), shutter: mat(0x8c9196), sign: mat(0xc9a77c), nameWall: mat(0x7a3b30),
  fence: mat(0x3f5f48), iron: mat(0x4a4d52), pole: mat(0x6d6f72), hoard: mat(0x8fa0b0), trunk: mat(0x8a8478), crown: mat(0x5d7a4a),
  stall: mat(0x8fa3b8), vault: new THREE.MeshLambertMaterial({ color: 0xd6d1c6, side: THREE.DoubleSide }), mesh: new THREE.MeshLambertMaterial({ color: 0x4a5550, transparent: true, opacity: 0.25, depthWrite: false }),
};

let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Boxes are collected per group and material and merged, so the whole site stays cheap to draw.
const batches = new Map();
function addGeom(group, material, geometry) {
  if (!batches.has(group)) batches.set(group, new Map());
  const byMat = batches.get(group);
  if (!byMat.has(material)) byMat.set(material, []);
  byMat.get(material).push(geometry);
}
function flush() {
  for (const [group, byMat] of batches) for (const [material, list] of byMat) {
    const m = new THREE.Mesh(mergeGeometries(list), material);
    m.castShadow = !material.transparent;
    m.receiveShadow = true;
    group.add(m);
  }
  batches.clear();
}

const world = new THREE.Group(), stalls = new THREE.Group();
scene.add(world, stalls);
const solids = [], stallSolids = [];  // boxes the walker collides with
function box(m, x0, x1, y0, y1, z0, z1, collide = false, group = world, hits = solids) {
  if (m) addGeom(group, m, new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0).translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
  if (collide) hits.push({ x0, x1, y0, y1, z0, z1 });
}
// ground surfaces: thin slabs whose tops differ, so overlaps don't flicker
const pave = (m, x0, x1, z0, z1, y) => box(m, x0, x1, 0, y, z0, z1);

// a wall along x (at z) or along z (at x), from a to b, leaving the gaps [[g0, g1], ...] in order
function wall(along, at, a, b, h, gaps = [], m = M.wall2, t = WT) {
  let s = a;
  for (const [g0, g1] of [...gaps, [b, b]]) {
    if (g0 > s) along === 'x' ? box(m, s, g0, 0, h, at - t / 2, at + t / 2, true) : box(m, at - t / 2, at + t / 2, 0, h, s, g0, true);
    s = g1;
  }
}
// a see-through fence of posts and rails, solid to the walker; panel: a faint mesh between the posts
function fence(along, at, a, b, h, gaps = [], m = M.fence, step = 2.5, panel = null) {
  const seg = (p, q, y0, y1, t, mm = m) => along === 'x' ? box(mm, p, q, y0, y1, at - t, at + t) : box(mm, at - t, at + t, y0, y1, p, q);
  let s = a;
  for (const [g0, g1] of [...gaps, [b, b]]) {
    if (g0 > s) {
      const n = Math.max(1, Math.round((g0 - s) / step));
      for (let i = 0; i <= n; i++) { const p = s + (g0 - s) * i / n; seg(p - 0.04, p + 0.04, 0, h, 0.04); }
      for (const y of [0.1, h - 0.05]) seg(s, g0, y - 0.03, y + 0.03, 0.025);
      if (panel) seg(s, g0, 0.1, h - 0.05, 0.005, panel);
      along === 'x' ? solids.push({ x0: s, x1: g0, y0: 0, y1: h, z0: at - 0.05, z1: at + 0.05 })
                    : solids.push({ x0: at - 0.05, x1: at + 0.05, y0: 0, y1: h, z0: s, z1: g0 });
    }
    s = g1;
  }
}

// a box on one face of block b, from a to c along that face, standing out by o (inward when o < 0)
function onFace(m, b, side, a, c, lo, hi, o = 0.06) {
  const [x0, x1] = b.x, [z0, z1] = b.z, span = (u, w) => u < w ? [u, w] : [w, u];
  if (side === 'n') box(m, a, c, lo, hi, ...span(z0 - o, z0));
  if (side === 's') box(m, a, c, lo, hi, ...span(z1, z1 + o));
  if (side === 'w') box(m, ...span(x0 - o, x0), lo, hi, a, c);
  if (side === 'e') box(m, ...span(x1, x1 + o), lo, hi, a, c);
}
// windows on the given sides of block b, floor by floor; keep: [side, from, to] spans left clear on the ground floor
function windows(b, floors, fh, { y0 = 0, w = 1.5, h = 1.5, sill = 0.9, step = 3.3, sides = 'nsew', keep = [], o = 0.06 } = {}) {
  for (const side of sides) {
    const [a0, a1] = 'ns'.includes(side) ? b.x : b.z;
    const n = Math.floor((a1 - a0) / step), pad = (a1 - a0 - n * step) / 2;
    for (let f = 0; f < floors; f++) for (let i = 0; i < n; i++) {
      const c = a0 + pad + (i + 0.5) * step, p = c - w / 2, q = c + w / 2;
      if (f === 0 && keep.some(([s, a, e]) => s === side && q > a && p < e)) continue;
      const lo = y0 + f * fh + sill;
      onFace(M.window, b, side, p, q, lo, lo + h, o);
    }
  }
}
// flats over a row of shops on one face; sides: faces that get windows upstairs
function shopBlock(b, floors, face, sides) {
  box(M.wall2, b.x[0], b.x[1], 0, 3.6 + (floors - 1) * 2.9 + 0.6, b.z[0], b.z[1], true);
  const [a0, a1] = 'ns'.includes(face) ? b.x : b.z;
  for (let a = a0 + 0.5; a + 4 <= a1 - 0.5; a += 4) {
    onFace(rand() < 0.5 ? M.shutter : M.glass, b, face, a + 0.3, a + 3.7, 0, 2.8, 0.04);
    onFace(M.sign, b, face, a + 0.15, a + 3.85, 3.0, 3.5, 0.25);
  }
  windows(b, floors - 1, 2.9, { y0: 3.6, sides, h: 1.4 });
}

const notes = [];  // labels: [lines, x, z, y, size, guess]; size: screen pixels per line
// floor, bld: shown only when that teaching building is cut at that floor
const note = (lines, x, z, y = 20, size = 14, guess = false, floor, bld = 'tb1') => notes.push([lines, x, z, y, size, guess, floor, bld]);

// ---------- the school ----------
pave(M.yard, SCHOOL.x[0], SCHOOL.x[1], SCHOOL.z[0], SCHOOL.z[1], 0.01);
const NAME_WALL = [62, 71.4];  // the school's name on a dark wall west of the gate, as at the Wusi school
wall('x', SCHOOL.z[0], SCHOOL.x[0], SCHOOL.x[1], WALL_H, [NAME_WALL, GATE]);
box(M.nameWall, NAME_WALL[0], NAME_WALL[1], 0, 3.2, -0.3, 0.3, true);
wall('x', SCHOOL.z[1], SCHOOL.x[0], SCHOOL.x[1], WALL_H);
wall('z', SCHOOL.x[0], SCHOOL.z[0], SCHOOL.z[1], WALL_H, [BACK]);
wall('z', SCHOOL.x[1], SCHOOL.z[0], SCHOOL.z[1], WALL_H);
box(M.wall, NAME_WALL[1], GATE[0], 0, 3.4, -0.4, 0.4, true);                     // gate pillars
box(M.wall, GATE[1], GATE[1] + 0.8, 0, 3.4, -0.4, 0.4, true);
box(M.iron, GATE[1] + 0.1, GATE[1] + 0.7, 0, 1.6, 0.4, 2.2, true);               // the folding gate, pushed open
for (const z of BACK) box(M.wall, -0.4, 0.4, 0, 3.0, z - 0.4, z + 0.4, true);
note(['大门', '校名墙在西边'], (GATE[0] + GATE[1]) / 2, 3, 6);
note(['后门'], 3, (BACK[0] + BACK[1]) / 2, 6);


// ---------- teaching building 1, inside ----------
const tb1F = [], tb1Furn = [], tb1Roof = new THREE.Group(), furnSolids = [];  // per floor: walls, stairs and slab; desks
for (let f = 0; f < TB1.floors; f++) { tb1F.push(new THREE.Group()); tb1Furn.push(new THREE.Group()); }
scene.add(tb1Roof, ...tb1F, ...tb1Furn);
// a wall along x (at z) or along z (at x) from a to b, y0 to y1, into group g, with openings { a, b, lo, hi, m }:
// lo and hi above y0; m, if given, fills the opening as glass
function wallOpen(g, along, at, a, b, y0, y1, t, open = [], m = M.wall) {
  const put = (p, q, lo, hi, mm, tt, collide) => along === 'x'
    ? box(mm, p, q, lo, hi, at - tt / 2, at + tt / 2, collide, g) : box(mm, at - tt / 2, at + tt / 2, lo, hi, p, q, collide, g);
  let s = a;
  for (const o of [...open].sort((u, v) => u.a - v.a)) {
    if (o.a > s) put(s, o.a, y0, y1, m, t, true);
    if (o.lo > 0) put(o.a, o.b, y0, y0 + o.lo, m, t, true);
    if (o.hi < y1 - y0) put(o.a, o.b, y0 + o.hi, y1, m, t, true);
    if (o.m) put(o.a, o.b, y0 + o.lo, y0 + o.hi, o.m, 0.04, false);  // the sill keeps the walker off the glass
    s = Math.max(s, o.b);
  }
  if (b > s) put(s, b, y0, y1, m, t, true);
}
// a room's fixtures laid out from the wall with its door (`side`, door centred at dc along that wall): u runs along that wall,
// v back from it; put() draws in those terms into group g, colliding with the walker when asked
function roomFrame(g, room, base, side) {
  const [x0, x1] = room.x, [z0, z1] = room.z, alongX = side === 'n' || side === 's';
  const put = (m, u0, u1, y0, y1, v0, v1, collide = false) => {
    const [p0, p1] = side === 'e' ? [x1 - v1, x1 - v0] : side === 'w' ? [x0 + v0, x0 + v1] : side === 's' ? [z1 - v1, z1 - v0] : [z0 + v0, z0 + v1];
    return alongX ? box(m, u0, u1, base + y0, base + y1, p0, p1, collide, g) : box(m, p0, p1, base + y0, base + y1, u0, u1, collide, g);
  };

function tb2Floor(x, z, y) {

  for (const s of TB2_SPIRALS) {
    const dx = x - s.c[0], dz = z - s.c[1], r = Math.hypot(dx, dz);
    if (r > 1.8) continue;
    if (r < 0.3) return -Infinity;  // the column
    const t = ((Math.atan2(dx, -dz) - s.e) % TAU + TAU) % TAU;
    for (let k = 0; k < TB2.floors - 1; k++) take(k * FH + FH * t / TAU);
    return best;
  }
  const A = TB2_ATRIUM;
  if (x > A.x[0] && x < A.x[1] && z > A.z[0] && z < A.z[1]) { take(0); return best; }
  for (let f = 0; f < TB2.floors; f++) take(f * FH);
  return best;
}

// the plaza: 0.6 m art stone slabs, a darker border band and rings in the middle
function plazaTexture(w, d) {
  const p = 20, tile = 0.6 * p, c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = w * p; c.height = d * p;
  for (let x = 0; x < c.width; x += tile) for (let y = 0; y < c.height; y += tile) {
    g.fillStyle = `hsl(38, 14%, ${79 + rand() * 4}%)`;
    g.fillRect(x, y, tile, tile);
  }
  g.globalAlpha = 0.55;
  g.lineWidth = 1.2 * p; g.strokeStyle = '#a99f8e';
  g.strokeRect(1.8 * p, 1.8 * p, (w - 3.6) * p, (d - 3.6) * p);
  for (const [r, col] of [[13, '#b8ab96'], [10, '#e2dbcf'], [7, '#a99f8e'], [2.5, '#c9bfae']]) {
    g.fillStyle = col; g.beginPath(); g.arc(w * p / 2, d * p / 2, r * p, 0, 2 * Math.PI); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = '#b3aa9a';  // joints
  for (let x = 0; x < c.width; x += tile) g.fillRect(x, 0, 1, c.height);
  for (let y = 0; y < c.height; y += tile) g.fillRect(0, y, c.width, 1);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

}

function runs(a, b, gaps) {
  const out = [];
  let s = a;
  for (const [g0, g1] of [...gaps].sort((p, q) => p[0] - q[0])) { if (g0 > s) out.push([s, Math.min(g0, b)]); s = Math.max(s, g1); }
  if (b > s) out.push([s, b]);
  return out.filter(([p, q]) => q - p > 0.5);
}

// They skip the fog and are blended toward the sky by hand, so they stay visible as hazy ridges past the fogged city.
const sky = new THREE.Color(0xd4d8dd), loess = new THREE.Color(0xa89a84), sunDir = new THREE.Vector3(10, 35, 8).normalize();
function ridge(side, dist, height, haze, span = 8000, step = 160) {  // side: −1 north, 1 south; dist: the crest's distance from the site
  const xs = [];
  for (let x = -span; x <= span; x += step) xs.push(x);
  const crest = xs.map(x => height * (1 - (x / span) ** 2) * (0.6 + 0.25 * Math.sin(x / 530 + side) + 0.1 * Math.sin(x / 170 - side) + 0.15 * rand()));
  const rows = [[dist - 500, 0], [dist - 250, 0.35], [dist, 1]].map(([d, k]) =>  // valley floor, foothills, crest
    xs.map((x, i) => new THREE.Vector3(FX + x + (rand() - 0.5) * step * 0.4, k ? crest[i] * k : -20, FZ + side * (d + (rand() - 0.5) * 120))));
  const pos = [], col = [], n = new THREE.Vector3(), e = new THREE.Vector3(), c = new THREE.Color();
  const tri = (a, b, d) => {
    n.subVectors(b, a).cross(e.subVectors(d, a)).normalize();
    if (n.z * side > 0) n.negate();  // face the site
    c.copy(loess).multiplyScalar(0.75 + 0.25 * Math.max(0, n.dot(sunDir))).lerp(sky, haze);
    for (const p of [a, b, d]) { pos.push(p.x, p.y, p.z); col.push(c.r, c.g, c.b); }
  };
  for (let r = 0; r < 2; r++) for (let i = 0; i + 1 < xs.length; i++) {
    tri(rows[r][i], rows[r][i + 1], rows[r + 1][i + 1]);
    tri(rows[r][i], rows[r + 1][i + 1], rows[r + 1][i]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide })));
}

// px: screen pixels per text line; sizeLabels() keeps it as the views zoom
function label(lines, px, guess) {
  const fonts = lines.map((_, i) => i ? '34px "Microsoft YaHei", sans-serif' : 'bold 44px "Microsoft YaHei", sans-serif');
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const widths = lines.map((t, i) => { g.font = fonts[i]; return g.measureText(t).width; });
  c.width = Math.ceil(Math.max(...widths)) + 24; c.height = 20 + 56 * lines.length;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  lines.forEach((t, i) => {
    g.font = fonts[i];
    g.lineWidth = 9; g.strokeStyle = 'rgba(255,255,255,.92)'; g.strokeText(t, c.width / 2, 38 + i * 56);
    g.fillStyle = guess ? '#a85400' : '#222'; g.fillText(t, c.width / 2, 38 + i * 56);
  });
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, fog: false }));
  s.renderOrder = 10;
  s.userData = { px, w: c.width / 56, h: c.height / 56 };
  return s;
}

    const lineH = s.userData.px * perPx;
    s.scale.set(lineH * s.userData.w, lineH * s.userData.h, 1);
  }
}

  `南北两头各一部螺旋楼梯；按场地图宽到 ${TB2.x[1] - TB2.x[0]} m，篮球场往西挪了。层高都是 ${FH} m。<br>` +
  `主路按胜利路做成双向四车道，路面 16 m，两边人行道各 5 m。小巷约 ${(ALLEY[1] - ALLEY[0]).toFixed(1)} m 宽。土路 7 m 宽，两边是杨树林。<br>` +
  `商场隧道 ${Math.round(MALL.x[1] - MALL.x[0])} × ${MALL.z[1] - MALL.z[0]} m，两层：一层是 ${TUNNEL[1] - TUNNEL[0]} m 宽的拱顶通道，两边各一排 4 m 宽的铺面；` +
  `${STAIR_X.length} 部楼梯上二楼，二楼是一排排 3 × 3 m 的铺位。<br>` +
  `从公交车站沿人行道走到校门约 ${toGate} m，正常走约 ${Math.round(toGate / 2.2 / 6) / 10} 分钟。<br>` +
  `红 = 门；蓝 = 窗；橙色 = 草图没画或没标、我猜的。草图外的城市是布景，走不进去。`;

// teleport spots: x, z, yaw (0 faces north)
const spots = {
  stop: [MAIN[0] - 0.8, STOP[1], 0], gate: [(GATE[0] + GATE[1]) / 2, -5, Math.PI], plaza: [87, 24, Math.PI],
  back: [-9, (BACK[0] + BACK[1]) / 2, -Math.PI / 2], alley: [(ALLEY[0] + ALLEY[1]) / 2, -2.5, Math.PI], field: [-30, 8, Math.PI / 2], iron: [(DIRT[0] + DIRT[1]) / 2, IRON - 46, Math.PI],
  tb1: [TB1.x[0] - 4, (TB1_DOOR1[0] + TB1_DOOR1[1]) / 2, -Math.PI / 2], tb2: [TB2.x[1] + 1, (TB2_DOOR1[0] + TB2_DOOR1[1]) / 2, Math.PI / 2],
  mall: [MALL.x[1] - 3, (TUNNEL[0] + TUNNEL[1]) / 2, Math.PI / 2], mall2: [66, 107.25, Math.PI / 2, MF],  // optional 4th: floor height
};

function refresh() {
  for (const b of document.querySelectorAll('[data-view]')) b.classList.toggle('on', b.dataset.view === view);
  for (const b of document.querySelectorAll('[data-orbit]')) b.classList.toggle('on', view === 'orbit' && b.dataset.orbit === orbit);
  for (const b of document.querySelectorAll('[data-eye]')) b.classList.toggle('on', +b.dataset.eye === player.eye);
  document.getElementById('tStalls').classList.toggle('on', showStalls);
  document.getElementById('tLabels').classList.toggle('on', showLabels);
  document.getElementById('hint').textContent = hints[view];
  const walking = view === 'walk';
  scene.fog = walking ? fog : null;
  planCtl.enabled = view === 'plan';
  orbitCtl.enabled = view === 'orbit';
  labels.visible = showLabels && !walking;
  const cutting = !walking && cut > 0;
  for (const [k, b] of Object.entries(CUTS)) {
    const on = cutting && k === cutB;
    b.floors.forEach((g, f) => { g.visible = !on || f < cut; });
    b.furn.forEach((g, f) => { g.visible = showFurn && (!on || f < cut); });
    b.roof.visible = !on;
  }
  for (const s of labels.children) if (s.userData.floor !== undefined) s.visible = cutting && s.userData.bld === cutB && s.userData.floor === cut - 1;
  for (const b of document.querySelectorAll('[data-cut]')) b.classList.toggle('on', cutting && b.dataset.cut === `${cutB}:${cut}`);
  document.getElementById('tFurn').classList.toggle('on', showFurn);
  stalls.visible = showStalls;
  marker.visible = !walking;
  marker.scale.setScalar(view === 'plan' ? 4 : 2);
  document.getElementById('cross').hidden = !walking;
  if (!walking && document.pointerLockElement) document.exitPointerLock();
}
function setView(v) { view = v; refresh(); }
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);
for (const b of document.querySelectorAll('[data-orbit]')) b.onclick = () => { orbit = b.dataset.orbit; cut = 0; aim(orbit); setView('orbit'); };
for (const b of document.querySelectorAll('[data-cut]')) b.onclick = () => {
  const [k, n] = b.dataset.cut.split(':');
  cutB = k;
  cut = +n;
  if (cut) { orbit = 'cut'; aim('cut'); }
  setView('orbit');
};
for (const b of document.querySelectorAll('[data-go]')) b.onclick = () => {
  [player.x, player.z, player.yaw, player.y = 0] = spots[b.dataset.go];
  player.pitch = 0;
  setView('walk');
};
for (const b of document.querySelectorAll('[data-eye]')) b.onclick = () => { player.eye = +b.dataset.eye; refresh(); };
document.getElementById('tStalls').onclick = () => { showStalls = !showStalls; refresh(); };
document.getElementById('tLabels').onclick = () => { showLabels = !showLabels; refresh(); };
document.getElementById('tFurn').onclick = () => { showFurn = !showFurn; refresh(); };
refresh();

const keys = new Set();
addEventListener('keydown', e => {
  if (e.key === '1') setView('plan');
  if (e.key === '2') setView('orbit');
  if (e.key === '3') setView('walk');
  keys.add(e.code);
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

let dragging = false;
canvas.addEventListener('mousedown', () => {
  if (view !== 'walk') return;
  dragging = true;
  canvas.requestPointerLock?.()?.catch?.(() => {});
});
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (view !== 'walk' || !(dragging || document.pointerLockElement === canvas)) return;
  player.yaw -= e.movementX * 0.0025;
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch - e.movementY * 0.0025));
});

// ---------- walking ----------
const R = 0.2;
function blocked(x, z) {
  const hit = b => x > b.x0 - R && x < b.x1 + R && z > b.z0 - R && z < b.z1 + R && b.y0 < player.y + 1.8 && b.y1 > player.y + 0.3;
  return solids.some(hit) || (showStalls && stallSolids.some(hit)) || (showFurn && furnSolids.some(hit));
}
// the ground, or the rostrum and its steps (a smooth ramp) when the walker can step onto them
function support(x, z, y) {
  const inside = b => x > b.x[0] && x < b.x[1] && z > b.z[0] && z < b.z[1];
  if (inside(STEPS)) return STAND.h * (z - STEPS.z[0]) / (STEPS.z[1] - STEPS.z[0]);
  if (inside(STAND) && y > STAND.h - 0.45) return STAND.h;
  if (z > STAIR_TOP && z < TUNNEL[0] && STAIR_X.some(s => Math.abs(x - s) < 1.5)) return MF * (TUNNEL[0] - z) / (TUNNEL[0] - STAIR_TOP);
  if (inside(MALL) && y > MF - 0.45) return MF;
  if (x > TB1.x[0] - 1.62 && x < TB1.x[1] + 0.12 && z > TB1.z[0] - 0.12 && z < TB1.z[1] + 0.12) return tb1Floor(x, z, y);
  if (x > TB2.x[0] - 0.12 && x < TB2.x[1] + 0.12 && z > TB2.z[0] - 0.12 && z < TB2.z[1] + 0.12) return tb2Floor(x, z, y);
  if (x > TOILET.x[0] - 0.12 && x < TOILET.x[1] && z > TOILET.z[0] - 0.12 && z < TOILET_STAIR.z[1]) return toiletFloor(x, z, y);
  return 0;
}
function walk(dt) {
  const f = (keys.has('KeyW') || keys.has('ArrowUp')) - (keys.has('KeyS') || keys.has('ArrowDown'));
  const s = (keys.has('KeyD') || keys.has('ArrowRight')) - (keys.has('KeyA') || keys.has('ArrowLeft'));
  if (!f && !s) return;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.8 : 2.2) * dt / Math.hypot(f, s);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = (-sin * f + cos * s) * speed, dz = (-cos * f - sin * s) * speed;
  for (const [mx, mz] of [[dx, 0], [0, dz]]) {
    const x = player.x + mx, z = player.z + mz, h = support(x, z, player.y);
    if (blocked(x, z) || h < player.y - 0.45) continue;  // no walking off an edge, or into a spot with nothing to stand on
    player.x = x;
    player.z = z;
    player.y = h;
  }
}

window.walk = walk;  // to step the walker frame by frame from the console
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (view === 'walk') walk(dt);
  walkCam.position.set(player.x, player.y + player.eye, player.z);
  walkCam.rotation.set(player.pitch, player.yaw, 0);
  marker.position.set(player.x, player.y, player.z);
  marker.rotation.y = player.yaw;
  body.scale.y = player.eye;
  body.position.y = player.eye / 2;
  nose.position.set(0, player.eye, -0.25);
  // the sun's shadow box follows the walker, or covers what the view frames
  const near = view === 'orbit' && orbit !== 'site', cutV = view === 'orbit' && orbit === 'cut', cc = CUTS[cutB].c;
  const r = view === 'walk' ? 80 : cutV ? (cutB === 'small' ? 100 : 60) : near ? 110 : 230;
  const [cx, cz] = view === 'walk' ? [player.x, player.z] : cutV ? [cc[0], cc[2]] : near ? [SCHOOL_C[0], SCHOOL_C[2]] : [FX, FZ];
  const k = r / 40;
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx + 10 * k, 35 * k, cz + 8 * k);
  if (sun.shadow.camera.right !== r) {
    Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r });
    sun.shadow.camera.updateProjectionMatrix();
  }
  if (labels.visible) sizeLabels(cams[view]);
  renderer.render(scene, cams[view]);
});
</script>
</body>
</html>
