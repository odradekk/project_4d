<body>
<div id="ui">

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- layout: meters, x = sketch right, z = sketch down, walls by centerline, y up from each floor ----------
const H = 3.0;                  // ceiling height, same as the current home.tscn
const SLAB = 0.2, S = H + SLAB; // floor slab, storey height
const FLOORS = 3, HOME = 1;     // three storeys; we live on the second (index 1)
const EXT = 0.24, INT = 0.12;   // brick walls: exterior one brick, interior half a brick
const DOOR_H = 2.0;
const door = (a, b, front = false) => ({ a, b, lo: 0, hi: DOOR_H, door: true, front });
const win = (a, b, lo = 0.9, hi = 2.3) => ({ a, b, lo, hi });
const balconyWin = (a, b) => win(a, b, 1.0, 2.6);  // parapet with windows above

const E = 7.85, B = E + 1.35, D = 7.35;  // our flat: east wall, balcony outer wall, south wall
const CW = 1.72;              // open corridor along the west side, railed
const V = 1.7;                // vestibule behind the public door, shared with the neighbor
const zB = 2 * D + V;         // the neighbor's flat mirrors ours across the vestibule and ends here
const zS = zB + 4.25;         // stair hall between zB and zS; the other half of the floor mirrors this one
const LEN = zB + zS, SC = LEN / 2;
const STEPS = 14, RISE = S / (2 * STEPS), GO = 0.38, RUN = (STEPS - 1) * GO;  // risers per flight, two flights per storey
const SX = E - EXT / 2 - 1.4 - RUN;  // flights start here; 1.4 m landing at the turn

// along: the axis the wall runs on; at: its position on the other axis; h: height if not H; guess: not in the sketch
const walls = [
  { along: 'x', at: 0,    span: [0, E],    t: EXT },
  { along: 'z', at: 0,    span: [0, D],    t: EXT, open: [win(0.9, 2.5)] },
  { along: 'x', at: D,    span: [0, E],    t: EXT, open: [door(0.25, 1.25, true)] },
  { along: 'z', at: E,    span: [0, D],    t: EXT, open: [win(0.3, 2.7), door(3.0, 3.85), win(5.1, 6.9)] },
  { along: 'x', at: 0,    span: [E, B],    t: EXT, open: [balconyWin(E + 0.15, B - 0.15)] },
  { along: 'z', at: B,    span: [0, 4.0],  t: EXT, open: [balconyWin(0.15, 3.85)] },
  { along: 'x', at: 4.0,  span: [E, B],    t: EXT, open: [balconyWin(E + 0.15, B - 0.15)] },
  { along: 'z', at: 1.8,  span: [0, 4.0],  t: INT },
  { along: 'x', at: 4.0,  span: [0, 1.8],  t: INT, open: [door(0.6, 1.4)] },
  { along: 'x', at: 4.0,  span: [1.8, E],  t: INT, open: [door(2.15, 3.05)] },
  { along: 'z', at: 3.25, span: [4.0, D],  t: INT, open: [door(4.15, 5.05)] },
  { along: 'z', at: 1.8,  span: [5.5, D],  t: INT },
  { along: 'x', at: 5.5,  span: [1.8, 3.25], t: INT, open: [door(2.2, 2.9)], guess: true },
];
const vestibule = [
  { along: 'z', at: 0,   span: [D, D + V], t: EXT, open: [door(D + 0.4, D + 1.3)] },  // public door from the corridor
  { along: 'z', at: 1.8, span: [D, D + V], t: EXT },
];
const hallWest = { along: 'z', at: -CW, span: [zB, zS], t: EXT, h: S, open: [win(zB + 1.4, zS - 1.4)] };
const hallEast = { along: 'z', at: E,   span: [zB, zS], t: EXT, h: S, open: [win(zB + 1.0, zS - 1.0, 1.2, 2.6)] };

const rooms = [
  { name: '厨房',       x: [0, 1.8],     z: [0, 4.0],    tile: true },
  { name: '客厅',       x: [1.8, E],     z: [0, 4.0],    note: '父亲睡这里', at: [3.4, 2.9] },
  { name: '阳台',       x: [E, B],       z: [0, 4.0],    tile: true },
  { name: '小满的房间', x: [3.25, E],    z: [4.0, D],    note: '原本的双人主卧' },
  { name: '过道',       x: [0, 3.25],    z: [4.0, 5.5] },
  { name: '门厅',       x: [0, 1.8],     z: [5.5, D] },
  { name: '卫生间？',   x: [1.8, 3.25],  z: [5.5, D],    tile: true, guess: true, note: '草图没标' },
];
const areas = [
  { lines: ['露天公走廊', '外侧有围栏'], x: -CW / 2, z: 3.0 },
  { lines: ['共用小门厅', `${(1.8 - EXT).toFixed(2)} × ${(V - EXT).toFixed(2)} m · 两户共用`], x: 0.9, z: D + V / 2 },
  { lines: ['邻居家'], x: E / 2, z: zB - D / 2 },
  { lines: ['楼梯间', `每跑 ${STEPS} 级`], x: (SX - CW) / 2, z: SC },
];

// placeholders for scale only
const furniture = [
  { name: '灶台',     x: [0.12, 0.72], z: [0.4, 2.8],  h: 0.8 },
  { name: '钢琴',     x: [1.86, 2.46], z: [0.8, 2.3],  h: 1.25 },
  { name: '三人沙发', x: [4.0, 6.0],   z: [0.12, 0.97], h: 0.85 },
  { name: '茶几',     x: [4.4, 5.6],   z: [1.7, 2.3],  h: 0.45 },
  { name: '父亲的床', x: [6.53, 7.73], z: [0.5, 2.5],  h: 0.45 },
  { name: '电视柜',   x: [4.4, 5.6],   z: [3.49, 3.94], h: 0.6 },
  { name: '双人床',   x: [5.73, 7.73], z: [4.06, 5.56], h: 0.45 },
  { name: '书桌',     x: [7.13, 7.73], z: [5.8, 7.0],  h: 0.75 },
  { name: '衣柜',     x: [3.31, 3.91], z: [5.6, 7.1],  h: 2.0 },
  { name: '洗手池',   x: [2.71, 3.19], z: [6.0, 6.5],  h: 0.8 },
  { name: '蹲坑',     x: [1.95, 2.45], z: [6.6, 7.1],  h: 0.05 },
];

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const BX = (-CW + B) / 2;  // building center across
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4d8dd);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b0b0, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(BX + 10, 35, SC + 8);
sun.target.position.set(BX, 0, SC);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 400 });
scene.add(sun, sun.target);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const M = {
  wall: mat(0xf0efea), guessWall: mat(0xf2c48a), floor: mat(0xb3aca1), tile: mat(0xc8cdd0), guessFloor: mat(0xe3c9a4),
  slab: mat(0xd9d7d1), stair: mat(0xcfcac0), rail: mat(0x7a8088), ground: mat(0xa7ad9f),
  furn: mat(0x8fa3b8), door: mat(0xd02a2a), front: mat(0x8a3b2e), window: mat(0x6fa8e0),
  road: mat(0x9c9b96), asphalt: mat(0x55585c), line: mat(0xeeeeea), fence: mat(0x3f5f48), trunk: mat(0x8a8478), crown: mat(0x5d7a4a),
  walk: mat(0xb8b4ab), bike: mat(0x6e7174), green: mat(0x8a9a74), wall2: mat(0xe2dccf), sign: mat(0xc9a77c), shutter: mat(0x8c9196),
  pole: mat(0x6d6f72), ballast: mat(0x8e8a82), sleeper: mat(0x7a6c5c), glass: mat(0x7f8b96),
};

// Boxes are collected per group and material and merged, so the six floors stay cheap to draw.
const batches = new Map();
function addGeom(group, material, geometry) {
  if (!batches.has(group)) batches.set(group, new Map());
  const byMat = batches.get(group);
  if (!byMat.has(material)) byMat.set(material, []);
  byMat.get(material).push(geometry);
}
const addBox = (group, material, x0, x1, y0, y1, z0, z1) =>
  addGeom(group, material, new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0).translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2));
function flush() {
  for (const [group, byMat] of batches) for (const [material, list] of byMat) {
    const m = new THREE.Mesh(mergeGeometries(list), material);
    m.castShadow = m.receiveShadow = true;
    group.add(m);
  }
  batches.clear();
}

// specs: boxes in local coordinates, drawn unless material is null; place() lifts them by dy and, with flip, mirrors z into dz − z
const spec = (list, x0, x1, y0, y1, z0, z1, material, collide = false) => list.push({ x0, x1, y0, y1, z0, z1, material, collide });
const mirror = (specs, about) => specs.map(s => ({ ...s, z0: about - s.z1, z1: about - s.z0 }));
const solids = [], furnSolids = [];  // boxes the walker collides with
function place(specs, dy, dz, flip, group, hits = solids) {
  for (const s of specs) {
    const [z0, z1] = flip ? [dz - s.z1, dz - s.z0] : [dz + s.z0, dz + s.z1];
    if (s.material) addBox(group, s.material, s.x0, s.x1, dy + s.y0, dy + s.y1, z0, z1);
    if (s.collide) hits.push({ x0: s.x0, x1: s.x1, y0: dy + s.y0, y1: dy + s.y1, z0, z1 });
  }
}

// frontOpen: the front door is a doorway (ours) instead of a shut leaf
function wallSpecs(list, w, frontOpen = false) {
  const e = w.t / 2, h = w.h ?? H, material = w.guess ? M.guessWall : M.wall;
  const rect = (a, b) => w.along === 'x' ? [a, b, w.at - e, w.at + e] : [w.at - e, w.at + e, a, b];
  const piece = (a, b, lo, hi) => {
    if (b - a < 1e-3 || hi - lo < 1e-3) return;
    const [x0, x1, z0, z1] = rect(a, b);
    spec(list, x0, x1, lo, hi, z0, z1, material, true);
  };
  let cur = w.span[0] - e;
  for (const o of [...(w.open ?? [])].sort((p, q) => p.a - q.a)) {
    piece(cur, o.a, 0, h); piece(o.a, o.b, 0, o.lo); piece(o.a, o.b, o.hi, h);
    cur = o.b;
    const [x0, x1, z0, z1] = rect(o.a, o.b);
    if (!w.h) spec(list, x0, x1, H, H + 0.01, z0, z1, o.door ? M.door : M.window);  // marks the opening in plan
    if (o.front && !frontOpen) {
      const [lx0, lx1, lz0, lz1] = w.along === 'x' ? [x0, x1, w.at - 0.03, w.at + 0.03] : [w.at - 0.03, w.at + 0.03, z0, z1];
      spec(list, lx0, lx1, 0, DOOR_H, lz0, lz1, M.front, true);
    } else if (o.door) {
      spec(list, x0, x1, 0, 0.012, z0, z1, M.door);
    }
  }
  piece(cur, w.span[1] + e, 0, h);
}

// our flat in full; every other flat only by its outer walls, front door shut
function flatSpecs(home) {
  const list = [];
  for (const w of walls) if (home || w.t === EXT) wallSpecs(list, w, home);
  if (home) for (const r of rooms) spec(list, r.x[0], r.x[1], 0, 0.004, r.z[0], r.z[1], r.guess ? M.guessFloor : r.tile ? M.tile : M.floor);
  return list;
}
// floor slabs under one half of a floor: our flat with the corridor beside it, the vestibule, the neighbor's flat
function halfSlabs() {
  const list = [];
  spec(list, -CW, E + EXT / 2, -SLAB, 0, -EXT / 2, D + EXT / 2, M.slab);
  spec(list, E, B + EXT / 2, -SLAB, 0, -EXT / 2, 4.0 + EXT / 2, M.slab);
  spec(list, -CW, 1.8 + EXT / 2, -SLAB, 0, D, D + V, M.slab);
  return [...list, ...mirror(list, zB)];
}
// railing along x or z at `at`, from a to b: an invisible collider, a handrail and bars
function railSpecs(list, along, at, a, b, h = 1.1, gap = 0.15, material = M.rail) {
  const box = (p, q, y0, y1, m, hit = false) => along === 'z'
    ? spec(list, at - 0.03, at + 0.03, y0, y1, p, q, m, hit)
    : spec(list, p, q, y0, y1, at - 0.03, at + 0.03, m, hit);
  box(a, b, 0, h, null, true);
  box(a, b, h - 0.06, h, material);
  for (let p = a; p < b; p += gap) box(p, p + 0.03, 0, h - 0.06, material);
}
function halfSpecs() {
  const list = halfSlabs();
  for (const w of vestibule) wallSpecs(list, w);
  railSpecs(list, 'z', -CW, 0, zB);           // corridor railing
  railSpecs(list, 'x', 0, -CW, -EXT / 2);     // across the corridor end
  return list;
}
function stairSpecs(f) {
  const list = [];
  spec(list, -CW, SX, -SLAB, 0, zB, zS, M.slab);  // landing at the floor, joins both corridors
  if (f > 0) wallSpecs(list, hallWest);  // on the ground floor this side is the open way out
  wallSpecs(list, hallEast);
  if (f < FLOORS - 1) {
    for (let i = 1; i < STEPS; i++) {
      spec(list, SX + (i - 1) * GO, SX + i * GO, i * RISE - 0.3, i * RISE, zB + EXT / 2, SC - 0.06, M.stair);  // up eastward
      spec(list, SX + RUN - i * GO, SX + RUN - (i - 1) * GO, S / 2 + i * RISE - 0.3, S / 2 + i * RISE, SC + 0.06, zS - EXT / 2, M.stair);  // up westward
    }
    spec(list, SX + RUN, E - EXT / 2, S / 2 - SLAB, S / 2, zB, zS, M.slab);  // landing at the turn
    spec(list, SX, SX + RUN, 0, S, SC - 0.06, SC + 0.06, M.wall, true);       // wall between the flights
  } else {
    railSpecs(list, 'z', SX, zB + EXT / 2, SC);                               // top floor: railing at the stairwell
  }
  return list;
}

const floors = [];  // one group per storey; the last holds the roof
for (let f = 0; f <= FLOORS; f++) {
  const g = new THREE.Group();
  scene.add(g);
  floors.push(g);
}
const half = halfSpecs(), other = flatSpecs(false), neighbor = mirror(other, zB);
const homeHalf = [...flatSpecs(true), ...neighbor, ...half], otherHalf = [...other, ...neighbor, ...half];
const roof = halfSlabs(), hallRoof = [];
spec(hallRoof, -CW, E + EXT / 2, -SLAB, 0, zB, zS, M.slab);
// one building at the origin; home puts our flat on its second floor; floorGroup(f) picks where floor f goes
function building(home, floorGroup, hits) {
  for (let f = 0; f < FLOORS; f++) {
    place(home && f === HOME ? homeHalf : otherHalf, f * S, 0, false, floorGroup(f), hits);
    place(otherHalf, f * S, LEN, true, floorGroup(f), hits);
    place(stairSpecs(f), f * S, 0, false, floorGroup(f), hits);
  }
  place(roof, FLOORS * S, 0, false, floorGroup(FLOORS), hits);
  place(roof, FLOORS * S, LEN, true, floorGroup(FLOORS), hits);
  place(hallRoof, FLOORS * S, 0, false, floorGroup(FLOORS), hits);
}
building(true, f => floors[f], solids);
const typical = new THREE.Group(), typicalSolids = [];  // copied to every other building
building(false, () => typical, typicalSolids);

// ---------- the compound: identical buildings in a grid, ours in the north-west corner; y from the ground ----------
// building offsets, about 10 m apart across and 8 m apart along; ours is at (0, 0)
const COLS = [0, 21, 42, 63], NORTH = [0, 45], SOUTH = [105, 150];
const buildings = COLS.flatMap(x => [...NORTH, ...SOUTH].map(z => [x, z]));
const westRoad = [-18, -11], crossRoad = [90, 97];  // x of the road along the west side, z of the road to the gate
const fence = { x0: -24, x1: 78, z0: -12, z1: 197 };
const FX = (fence.x0 + fence.x1) / 2, FZ = (fence.z0 + fence.z1) / 2;  // compound center
const mainRoad = [91, 106];                          // x of the main road's motor lanes outside the gate
const busStop = { x: 80.5, z: crossRoad[0] - 23 };   // shelter's back corner on the sidewalk; open toward the street
const lane = c => [c - CW - 5, c - CW - 2];          // x of the path along the west side of column c
const siteSpecs = [];
const pave = (x0, x1, z0, z1, m = M.road) => spec(siteSpecs, x0, x1, 0, 0.02, z0, z1, m);
pave(westRoad[0], westRoad[1], fence.z0 + 2, fence.z1 - 2);
pave(westRoad[1], mainRoad[0], crossRoad[0], crossRoad[1]);
// every stair hall exit reaches a road: the first column straight to the west road,
// the others onto a path along their west side that runs to the road to the gate
for (const [ox, oz] of buildings) {
  if (!ox) pave(westRoad[1], -CW, oz + SC - 1.5, oz + SC + 1.5);
  else pave(lane(ox)[1], ox - CW, oz + SC - 1.5, oz + SC + 1.5);
}
for (const c of COLS.slice(1)) {
  pave(...lane(c), NORTH[0], crossRoad[0]);
  pave(...lane(c), crossRoad[1], SOUTH.at(-1) + LEN);
}
const mid = (mainRoad[0] + mainRoad[1]) / 2;
const fenceRun = (along, at, a, b) => railSpecs(siteSpecs, along, at, a, b, 1.8, 0.3, M.fence);
fenceRun('x', fence.z0, fence.x0, fence.x1);
fenceRun('x', fence.z1, fence.x0, fence.x1);
fenceRun('z', fence.x0, fence.z0, fence.z1);
fenceRun('z', fence.x1, fence.z0, crossRoad[0] - 0.6);
fenceRun('z', fence.x1, crossRoad[1] + 0.6, fence.z1);
for (const z of [crossRoad[0] - 0.6, crossRoad[1]]) spec(siteSpecs, fence.x1 - 0.3, fence.x1 + 0.3, 0, 2.6, z, z + 0.6, M.wall, true);  // gate pillars
const { x: bx, z: bz } = busStop;
spec(siteSpecs, bx, bx + 0.1, 0, 2.5, bz, bz + 8, M.wall, true);                  // back wall
spec(siteSpecs, bx, bx + 2.6, 2.5, 2.65, bz, bz + 8, M.slab);                     // roof
for (const z of [bz, bz + 7.9]) spec(siteSpecs, bx + 2.5, bx + 2.6, 0, 2.5, z, z + 0.1, M.rail, true);
spec(siteSpecs, bx + 0.1, bx + 0.5, 0, 0.45, bz + 1, bz + 7, M.furn, true);        // bench
spec(siteSpecs, bx + 3.2, bx + 3.28, 0, 3.0, bz - 1, bz - 0.92, M.rail, true);    // sign pole
spec(siteSpecs, bx + 3.0, bx + 3.5, 2.3, 3.0, bz - 1.02, bz - 0.9, M.window);     // sign
const site = new THREE.Group();
scene.add(site);
place(siteSpecs, -SLAB, 0, false, site);

// tall poplars along both roads, with gaps where paths meet them
const trees = [];
const treeRow = (along, at, a, b, gaps = [], step = 5) => {
  for (let p = a; p <= b; p += step) if (!gaps.some(([s, e]) => p > s && p < e)) trees.push(along === 'z' ? [at, p] : [p, at]);
};
const pathGaps = [...NORTH, ...SOUTH].map(oz => [oz + SC - 3, oz + SC + 3]);
const laneGaps = COLS.slice(1).map(c => [lane(c)[0] - 1.8, lane(c)[1] + 1.8]);
treeRow('z', westRoad[0] - 2.5, fence.z0 + 4, fence.z1 - 4);
treeRow('z', westRoad[1] + 2.5, fence.z0 + 4, fence.z1 - 4, [...pathGaps, [crossRoad[0] - 4, crossRoad[1] + 4]]);
treeRow('x', crossRoad[0] - 1.5, westRoad[1] + 5, fence.x1 - 4, laneGaps);

const sky = new THREE.Color(0xd4d8dd), loess = new THREE.Color(0xa89a84), sunDir = new THREE.Vector3(10, 35, 8).normalize();
function ridge(side, dist, height, haze, span = 8000, step = 160) {  // side: −1 north, 1 south; dist: the crest's distance from the compound
  const xs = [];
  for (let x = -span; x <= span; x += step) xs.push(x);
  const crest = xs.map(x => height * (1 - (x / span) ** 2) * (0.6 + 0.25 * Math.sin(x / 530 + side) + 0.1 * Math.sin(x / 170 - side) + 0.15 * rand()));
  const rows = [[dist - 500, 0], [dist - 250, 0.35], [dist, 1]].map(([d, k]) =>  // valley floor, foothills, crest
    xs.map((x, i) => new THREE.Vector3(FX + x + (rand() - 0.5) * step * 0.4, k ? crest[i] * k : -20, FZ + side * (d + (rand() - 0.5) * 120))));
  const pos = [], col = [], n = new THREE.Vector3(), e = new THREE.Vector3(), c = new THREE.Color();
  const tri = (a, b, d) => {
    n.subVectors(b, a).cross(e.subVectors(d, a)).normalize();
    if (n.z * side > 0) n.negate();  // face the compound
    c.copy(loess).multiplyScalar(0.75 + 0.25 * Math.max(0, n.dot(sunDir))).lerp(sky, haze);
    for (const p of [a, b, d]) { pos.push(p.x, p.y, p.z); col.push(c.r, c.g, c.b); }
  };
  for (let r = 0; r < 2; r++) for (let i = 0; i + 1 < xs.length; i++) {
    tri(rows[r][i], rows[r][i + 1], rows[r + 1][i + 1]);
    tri(rows[r][i], rows[r + 1][i + 1], rows[r + 1][i]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide })));
}

// lineH: world meters per text line
function label(lines, lineH) {
  const fonts = lines.map((_, i) => i ? '34px "Microsoft YaHei", sans-serif' : 'bold 44px "Microsoft YaHei", sans-serif');
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const widths = lines.map((t, i) => { g.font = fonts[i]; return g.measureText(t).width; });
  c.width = Math.ceil(Math.max(...widths)) + 24; c.height = 20 + 56 * lines.length;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  lines.forEach((t, i) => {
    g.font = fonts[i];
    g.lineWidth = 9; g.strokeStyle = 'rgba(255,255,255,.92)'; g.strokeText(t, c.width / 2, 38 + i * 56);
    g.fillStyle = i ? '#444' : '#111'; g.fillText(t, c.width / 2, 38 + i * 56);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  s.scale.set(lineH * c.width / 56, lineH * c.height / 56, 1);
  return s;
}

// half thickness of the wall on a room side, 0 where the side is open
function halfAt(along, at, [a, b]) {
  const w = walls.find(w => w.along === along && w.at === at && Math.min(w.span[1], b) > Math.max(w.span[0], a));
  return w ? w.t / 2 : 0;
}

const planCam = new THREE.OrthographicCamera();
planCam.position.set(PX, base + 40, PZ + 0.01);  // the tiny z offset keeps sketch-up (−z) at the top of the screen
const orbitCam = new THREE.PerspectiveCamera(50, 1, 0.1, 12000);  // far enough for the mountains
const walkCam = new THREE.PerspectiveCamera(70, 1, 0.1, 12000);
walkCam.rotation.order = 'YXZ';

const planCtl = new OrbitControls(planCam, canvas);
planCtl.target.set(PX, base, PZ);
planCtl.enableRotate = false;
planCtl.screenSpacePanning = true;
planCtl.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
const orbitCtl = new OrbitControls(orbitCam, canvas);
orbitCtl.maxPolarAngle = Math.PI / 2 - 0.05;
planCtl.update();
// orbit framing: the whole compound, or our building
function aim(whole) {
  const [t, d] = whole ? [[FX + 30, 0, FZ], [0, 330, 300]] : [[BX, FLOORS * S / 2, SC], [-40, 12, 32]];  // the compound seen from the south, north up as in the sketch
  orbitCtl.target.set(...t);
  orbitCam.position.set(t[0] + d[0], t[1] + d[1], t[2] + d[2]);
  orbitCtl.update();
}
aim(false);
const cams = { plan: planCam, orbit: orbitCam, walk: walkCam };

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const a = innerWidth / innerHeight;
  // fit the plan into the area right of the panel
  const panel = Math.min(300, innerWidth / 3), k = Math.min((innerWidth - panel) / (B + CW + 1.0), innerHeight / (D + V + 1.2));
  const cx = panel + (innerWidth - panel) / 2;
  Object.assign(planCam, { left: -cx / k, right: (innerWidth - cx) / k, top: innerHeight / 2 / k, bottom: -innerHeight / 2 / k });
  planCam.updateProjectionMatrix();
  for (const c of [orbitCam, walkCam]) { c.aspect = a; c.updateProjectionMatrix(); }
}
addEventListener('resize', resize);
resize();

// ---------- UI ----------
let view = 'plan', orbit = 'building', showFurn = true;  // orbit: 'site', 'building' or 'cut'
const hints = {
  plan: '我们这栋只显示到 2 层。拖动平移，滚轮缩放。数字是墙内净尺寸。',
  orbit: '左键旋转，右键平移，滚轮缩放。',
  walk: '点画面锁定鼠标（或按住拖动），WASD 走，Shift 快走，Esc 解锁。出入户门、过公共门，沿走廊到楼梯间，下楼出小道。能走出大门到公交站，再往外只是布景。',
};
document.getElementById('info').innerHTML =
  `小区约 ${fence.x1 - fence.x0} × ${fence.z1 - fence.z0} m，${buildings.length} 栋同样的楼，我们这栋在西北角。<br>` +
  `${FLOORS} 层，每层 4 户（楼梯两边各 2 户），我们家在 ${HOME + 1} 层。整栋约 ${(B + CW).toFixed(1)} × ${LEN.toFixed(1)} m。<br>` +
  `户内墙中线 ${E} × ${D} m，另加阳台；室内净面积 ${totalArea.toFixed(1)} m²。<br>` +
  `层高 ${S} m（净高 ${H} + 楼板 ${SLAB}）；门高 ${DOOR_H} m；踏步高 ${(RISE * 100).toFixed(1)} cm、宽 ${Math.round(GO * 100)} cm；一楼楼梯间西侧敞开，是出口。<br>` +
  `红条 = 门；蓝条 = 窗；橙色 = 草图没画、我猜的。`;

function refresh() {
  for (const b of document.querySelectorAll('[data-view]')) b.classList.toggle('on', b.dataset.view === view);
  for (const b of document.querySelectorAll('[data-orbit]')) b.classList.toggle('on', view === 'orbit' && b.dataset.orbit === orbit);
  for (const b of document.querySelectorAll('[data-eye]')) b.classList.toggle('on', +b.dataset.eye === player.eye);
  document.getElementById('tFurn').classList.toggle('on', showFurn);
  document.getElementById('hint').textContent = hints[view];
  const walking = view === 'walk', cutaway = view === 'plan' || (view === 'orbit' && orbit === 'cut');
  siteLabels.visible = view === 'orbit' && orbit === 'site';
  scene.fog = walking ? fog : null;
  planCtl.enabled = view === 'plan';
  orbitCtl.enabled = view === 'orbit';
  floors.forEach((g, f) => { g.visible = !cutaway || f <= HOME; });
  labels.visible = cutaway;
  furn.visible = showFurn;
  furnLabels.visible = showFurn && cutaway;
  marker.visible = !walking;
  document.getElementById('cross').hidden = !walking;
  if (!walking && document.pointerLockElement) document.exitPointerLock();
}
function setView(v) { view = v; refresh(); }
for (const b of document.querySelectorAll('[data-view]')) b.onclick = () => setView(b.dataset.view);
for (const b of document.querySelectorAll('[data-orbit]')) b.onclick = () => {
  const mode = b.dataset.orbit;
  if ((mode === 'site') !== (orbit === 'site')) aim(mode === 'site');
  orbit = mode;
  setView('orbit');
};
for (const b of document.querySelectorAll('[data-eye]')) b.onclick = () => { player.eye = +b.dataset.eye; refresh(); };
document.getElementById('tFurn').onclick = () => { showFurn = !showFurn; refresh(); };
refresh();

const keys = new Set();
addEventListener('keydown', e => {
  if (e.key === '1') setView('plan');
  if (e.key === '2') setView('orbit');
  if (e.key === '3') setView('walk');
  keys.add(e.code);
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

let dragging = false;
canvas.addEventListener('mousedown', () => {
  if (view !== 'walk') return;
  dragging = true;
  canvas.requestPointerLock?.()?.catch?.(() => {});
});
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (view !== 'walk' || !(dragging || document.pointerLockElement === canvas)) return;
  player.yaw -= e.movementX * 0.0025;
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch - e.movementY * 0.0025));
});

// ---------- walking ----------
const R = 0.2;
function blocked(x, z) {
  const hit = b => x > b.x0 - R && x < b.x1 + R && z > b.z0 - R && z < b.z1 + R && b.y0 < player.y + 1.8 && b.y1 > player.y + 0.3;
  return solids.some(hit) || (showFurn && furnSolids.some(hit));
}
// highest floor, flight or landing at (x, z) that a walker at height y can step onto; flights are smooth ramps
function support(x, z, y) {
  const at = buildings.find(([ox, oz]) => x > ox - CW - EXT / 2 && x < ox + E + EXT / 2 && z > oz - EXT / 2 && z < oz + LEN + EXT / 2);
  if (!at) return -SLAB;  // the ground
  x -= at[0];
  z -= at[1];
  const inWell = z > zB && z < zS && x > SX;
  const t = Math.min(1, Math.max(0, (x - SX) / RUN));
  let best = -SLAB;
  for (let f = 0; f < FLOORS; f++) {
    const b = f * S;
    const h = !inWell ? b : f === FLOORS - 1 ? -Infinity : z < SC ? b + t * S / 2 : b + S - t * S / 2;
    if (h <= y + 0.45 && h > best) best = h;
  }
  return best;
}
function walk(dt) {
  const f = (keys.has('KeyW') || keys.has('ArrowUp')) - (keys.has('KeyS') || keys.has('ArrowDown'));
  const s = (keys.has('KeyD') || keys.has('ArrowRight')) - (keys.has('KeyA') || keys.has('ArrowLeft'));
  if (!f && !s) return;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3.8 : 2.2) * dt / Math.hypot(f, s);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = (-sin * f + cos * s) * speed, dz = (-cos * f - sin * s) * speed;
  if (!blocked(player.x + dx, player.z)) player.x += dx;
  if (!blocked(player.x, player.z + dz)) player.z += dz;
  player.y = support(player.x, player.z, player.y);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (view === 'walk') walk(dt);
  walkCam.position.set(player.x, player.y + player.eye, player.z);
  walkCam.rotation.set(player.pitch, player.yaw, 0);
  marker.position.set(player.x, player.y, player.z);
  marker.rotation.y = player.yaw;
  body.scale.y = player.eye;
  body.position.y = player.eye / 2;
  nose.position.set(0, player.eye, -0.25);
  // the sun's shadow box follows the walker, or covers the compound in the compound view
  const whole = view === 'orbit' && orbit === 'site', r = whole ? 300 : 60, k = whole ? 4 : 1;
  const [cx, cz] = whole ? [FX, FZ] : [player.x, player.z];
  sun.target.position.set(cx, 0, cz);
  sun.position.set(cx + 10 * k, 35 * k, cz + 8 * k);
  if (sun.shadow.camera.right !== r) {
    Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r });
    sun.shadow.camera.updateProjectionMatrix();
  }
  renderer.render(scene, cams[view]);
});
</script>
</body>
</html>
